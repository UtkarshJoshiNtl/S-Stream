name: windows-build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "simulation/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulation/pyproject.toml

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .\simulation
          pip install pyinstaller

      - name: Build bundle
        run: python -m PyInstaller --clean --noconfirm .\simulation\packaging\sstream.spec

      - name: Zip bundle
        run: Compress-Archive -Path .\simulation\dist\sstream\* -DestinationPath .\sstream-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sstream-windows-x64
          path: sstream-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
