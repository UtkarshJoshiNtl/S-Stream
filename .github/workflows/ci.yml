name: Native simulation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev libsdl2-ttf-dev mesa-common-dev libgl1-mesa-dev libosmesa6-dev libegl1-mesa-dev xvfb mesa-utils
      - name: Configure
        run: cmake -B build -S simulation -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Voxelizer tests
        run: ./build/test_voxelize
      - name: LBM tests
        run: cd simulation && MESA_GL_VERSION_OVERRIDE=4.3 LIBGL_ALWAYS_SOFTWARE=1 USE_EGL=0 xvfb-run -a ../build/test_lbm
      - name: Integration test
        run: cd simulation && MESA_GL_VERSION_OVERRIDE=4.3 LIBGL_ALWAYS_SOFTWARE=1 USE_EGL=0 xvfb-run -a bash test/test_integration.sh
