name: test

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulation/pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ./simulation
          pip install pytest
      - name: Run tests
        run: python -m pytest simulation/tests
