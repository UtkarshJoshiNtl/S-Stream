[project]
name = "sstream-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "warp-lang>=1.8,<2",
    "pyvista>=0.43",
    "vtk>=9.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sstream = "sstream.cli:main"
sstream-place = "sstream.place:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running solver/regression check (still run by default)",
]
