[project]
name = "sstream-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyvista>=0.49.2,<1", "warp-lang>=1.8,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sstream = "sstream.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
